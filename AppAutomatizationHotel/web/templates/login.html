{% extends "base.html" %}
{% block contenido %}

<!-- Login Start -->
<div class="container-xxl py-5" style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
    <div class="container">
        
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-8">
                
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <i class="bi bi-shield-lock display-3 text-primary mb-3"></i>
                            <h2 class="text-uppercase fw-bold text-dark">Acceso al Sistema</h2>
                            <p class="text-muted">Por favor, ingresa tus credenciales</p>
                        </div>

                        <!-- Error Message -->
                        {% if mensaje %}
                        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2 fs-5"></i>
                            <div>{{ mensaje }}</div>
                        </div>
                        {% endif %}

                        <!-- Formulario de Login -->
                        <form action="{% url 'LO' %}" method="post">
                            {% csrf_token %}
                            
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                                <label for="email"><i class="bi bi-envelope me-2"></i>Correo Electrónico</label>
                            </div>
                            
                            <div class="mb-4 position-relative">
                                <div class="form-floating">
                                    <input type="password" class="form-control pe-5" id="pass" name="pass" placeholder="Contraseña" required>
                                    <label for="pass"><i class="bi bi-key me-2"></i>Contraseña</label>
                                </div>
                                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0 bg-transparent" style="z-index:5;" onclick="togglePassword()">
                                    <i class="bi bi-eye fs-5 text-muted" id="toggleIcon"></i>
                                </button>
                            </div>
                            
                            <div class="d-grid mb-3">
                                <button class="btn btn-primary py-3 fs-5 fw-bold shadow-sm" type="submit">
                                    <i class="bi bi-box-arrow-in-right me-2"></i> Ingresar
                                </button>
                            </div>
                            
                        </form>
                    </div>
                </div>
                
            </div>
        </div>

    </div>
</div>
<!-- Login End -->

<script>
function togglePassword() {
  const input = document.getElementById('pass');
  const icon = document.getElementById('toggleIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
}
</script>

{% endblock contenido %}
