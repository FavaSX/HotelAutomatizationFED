<div class="voucher-pagination-bar border-top px-4 py-2 bg-light d-flex flex-wrap justify-content-between align-items-center gap-3" id="paginationBar{{ suffix }}">
  <div class="small text-muted" id="pageInfo{{ suffix }}">
    Mostrando <strong id="pageRange{{ suffix }}">1–20</strong> de <strong id="pageTotal{{ suffix }}">{{ total }}</strong> vouchers
  </div>
  <div class="d-flex align-items-center gap-3">
    <div class="d-flex align-items-center gap-2">
      <label for="pageSizeSelect{{ suffix }}" class="small text-muted fw-semibold mb-0 text-nowrap">
        <i class="bi bi-card-list me-1"></i>Por página:
      </label>
      <select id="pageSizeSelect{{ suffix }}" class="form-select form-select-sm rounded-pill voucher-page-size-select" style="width: auto; min-width: 90px;" onchange="changeVoucherPageSize(this.value)">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="ALL">Todas</option>
      </select>
    </div>
    <nav aria-label="Paginación {{ label }}">
      <ul class="pagination pagination-sm mb-0 rounded-pill" id="paginationList{{ suffix }}"></ul>
    </nav>
  </div>
</div>
