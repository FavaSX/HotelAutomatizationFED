<div class="voucher-pagination-bar border-top px-4 py-2 bg-light d-flex flex-wrap justify-content-between align-items-center gap-3" id="paginationBar{{ suffix }}">
  <div class="small text-muted" id="pageInfo{{ suffix }}">
    Mostrando <strong id="pageRange{{ suffix }}">1–25</strong> de <strong id="pageTotal{{ suffix }}">{{ total }}</strong> vouchers
  </div>
  <div class="d-flex align-items-center gap-3">
    <select id="pageSizeSelect{{ suffix }}" class="form-select form-select-sm rounded-pill voucher-page-size-select" style="width: auto; min-width: 90px;" onchange="changeVoucherPageSize(this.value)" aria-label="Vouchers por página" title="Vouchers por página">
      <option value="10">Página 10</option>
      <option value="25" selected>Página 25</option>
      <option value="50">Página 50</option>
      <option value="100">Página 100</option>
      <option value="ALL">Todas</option>
    </select>
    <nav aria-label="Paginación {{ label }}">
      <ul class="pagination pagination-sm mb-0 rounded-pill" id="paginationList{{ suffix }}"></ul>
    </nav>
  </div>
</div>
